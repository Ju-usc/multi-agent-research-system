[project]
name = "multi-agent-research-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Newest stable release that still accepts GEPA(enable_tool_optimization=True).
    # That argument was removed in 3.1.3; later releases (including 3.4.1) reject it.
    "dspy==3.1.2",
    "openai",
    "jupyter",
    "pydantic",
    "nest-asyncio>=1.6.0",
    "pytest",
    "pandas",
    "parallel-web",
    "datasets>=4.4.2",
    "fastmcp>=2.9.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
