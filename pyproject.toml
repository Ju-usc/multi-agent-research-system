[project]
name = "multi-agent-research-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dspy @ git+https://github.com/stanfordnlp/dspy.git@main",
    "openai",
    "jupyter",
    "pydantic",
    "nest-asyncio>=1.6.0",
    "pytest",
    "pandas",
    "parallel-web",
    "datasets>=4.4.2",
    "fastmcp>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
